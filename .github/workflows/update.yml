name: Update manifest

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/**]

permissions:
  contents: write

concurrency:
  group: manifest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge the plugin manifests
        run: ./scripts/merge-manifests.sh
      - name: Commit when something changed
        run: |
          if git diff --quiet manifest.json; then
            echo "manifest unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "manifest: $(jq -r '[.[] | "\(.name) \(.versions[0].version)"] | join(", ")' manifest.json)"
          git push
